<script>
(function () {
"use strict";
const { $, light, mark, unlock } = GAME, focusNode = GAME.focus, sendPacket = GAME.packet;

// ---------- the stops ----------
const stops = [
{
  phase: "briefing",
  html: `
  <div class="kicker">Mission briefing</div>
  <h2>A pilot on Monday, and no time for paperwork</h2>
  <div class="box mission"><span class="tag">The situation</span>
  You are <b>Priya</b>, tech lead at <b>Helix</b>, which builds <b>Atlas</b>, a shipment-tracking data product, for
  <b>Northwind Freight</b>, a logistics company. It is Wednesday. On Monday Northwind starts a
  pilot of <b>Atlas MCP</b>, Atlas's MCP server: the door AI apps call (MCP is the Model Context Protocol).</div>
  <p>Two Northwind account managers will use it from <b>Claude Code</b>, an AI assistant in a terminal on their laptops;
  it is their <b>MCP host</b>, the AI app that calls MCP servers for them. <b>Anika</b> manages customer account
  AC-0417, <b>Ben</b> only AC-0999.</p>
  <p><b>Marcus</b>, Northwind's security lead: <i>"We need this working by Monday, and a new sign-in setup takes months."</i>
  <b>Tomasz</b>, Helix's backend engineer: <i>"Give them a key. Five minutes."</i></p>
  <div class="box why"><span class="tag">Why this level matters</span>
  Level 0 showed that a request carries no proof by itself. Atlas needs a <b>credential</b> in the
  <code>Authorization</code> header. The simplest is an <b>API key</b>: one long secret string that Helix makes and
  Northwind pastes into its AI app. Many real MCP servers ship this way, so every later level is measured against it.</div>
  <p><b>Your mission:</b> make the key, set it up, follow a request, then test it against real events. The map is the
  goal picture; it lights up as you go.</p>`,
  ready: true,
  enter() { focusNode(null); }
},
{
  phase: "setup",
  html: `
  <div class="kicker">Stop 1 of 6 &middot; Making the key</div>
  <h2>A string nobody can guess</h2>
  <p>Wednesday, 10:00. Before any request, Tomasz makes the key on Helix's side. Two choices matter.</p>
  <div class="box how"><span class="tag">How</span>
  <b>1. Random, from a secure source.</b> Python's <code>secrets</code> module draws from the operating system's
  secure random source:
  <pre class="req">&gt;&gt;&gt; import secrets
&gt;&gt;&gt; "atk_" + secrets.token_urlsafe(32)
'atk_7QmZ9xL2vR4kT8nB1cW6yF3hJ0sD5gA2pEXAMPLEKEY'</pre>
  32 random bytes become 43 characters (the sample on this page ends in EXAMPLEKEY, so no one takes it for a real
  key). A key built from a name, a date or Python's ordinary <code>random</code> module can be predicted:
  <b>Vex</b>, an attacker, could see one key and work out the next.<br><br>
  <b>2. A prefix.</b> <code>atk_</code> (for "Atlas key") is not secret. It lets <b>secret scanners</b>, tools that search
  code, chats and logs for strings shaped like keys, recognise an Atlas key and raise an alarm. GitHub's personal access
  tokens start <code>ghp_</code> for the same reason.</div>
  <div class="challenge" id="ch1">
    <h3>Challenge</h3>
    <p>Atlas must remember the key to check it later. Six months from now, a copy of Atlas's database backup,
    <code>atlas-db-2027-04-01.sql.gz</code>, leaks from a misconfigured storage bucket. <b>Which way of storing the key
    leaves Vex nothing he can use?</b></p>
    <div class="opts">
      <button class="opt" data-ok="0" data-fb="Vex opens the backup and reads atk_7QmZ9xL2... in the keys column. He puts it in an Authorization header, and Atlas answers him as Northwind. One leaked file hands over every customer's key. If an admin page can show the key again, so can anyone who reads the database.">In plain text, so Helix's admin page can show it again</button>
      <button class="opt" data-ok="0" data-fb="To check a request, Atlas must decrypt the stored key, so the decryption key sits on the same servers and in the same deploy files. Whoever steals the backup often gets the configuration too, and then every key decrypts. Encryption moved the secret; it did not remove it.">Encrypted, with the decryption key in Atlas's configuration</button>
      <button class="opt" data-ok="1" data-fb="Right. A hash is a one-way fingerprint: easy to compute from the key, impossible to turn back into it. Atlas stores the SHA-256 hash (SHA-256 is a standard hash function): 64 characters from 0-9 and a-f, such as 5b1e9c...a7d2. Vex finds only that. Finding a key that produces it means trying around 10^77 possibilities. To check a request, Atlas hashes the key it is shown and compares fingerprints. Atlas shows the key once, when it is made, and never again.">Only a hash of the key (its fingerprint)</button>
    </div>
    <div class="feedback" id="fb1"></div>
  </div>
  <details class="more"><summary>Why a fast hash is right here, unlike for passwords</summary><div>
  Passwords are stored with slow hashes because people choose guessable ones: <code>Summer2026!</code> is on every
  guessing list. One graphics card computes about 20 billion SHA-256 hashes a second, so a fast hash lets a thief try a
  whole list in a second. A key from <code>secrets.token_urlsafe(32)</code> is on no list. It is one of 2<sup>256</sup>
  equally likely values. At 20 billion guesses a second, trying half of them takes about 10<sup>59</sup> years. A slow
  hash cannot make that search harder; it only slows every honest request.</div></details>`,
  ready: false,
  enter(api) {
    focusNode("n-keys");
    unlock("API key: a long random secret");
    api.choice("#ch1", "#fb1", () => { light(["n-keys"]); unlock("store only the key's hash"); });
  }
},
{
  phase: "setup",
  html: `
  <div class="kicker">Stop 2 of 6 &middot; Whose key, and how it travels</div>
  <h2>One account, one hand-over, one paste</h2>
  <p>A key alone means nothing. Tomasz files a record against its hash that says what it may do:</p>
  <pre class="req">key record   k_01
  hash       sha256:5b1e9c...a7d2
  account    northwind-pilot
  customers  <span class="hl" id="customers">?</span>
  status     active      created 2030-03-06T10:00Z      expires: never</pre>
  <p><code>northwind-pilot</code> is a <b>service account</b>: an account for a program or a group, not for a person.
  Atlas has no record of Anika or Ben.</p>
  <div class="challenge" id="ch2">
    <h3>Challenge</h3>
    <p>Anika manages AC-0417, Ben AC-0999, and both paste the same key. <b>Which customers must
    <code>northwind-pilot</code> allow?</b></p>
    <div class="opts">
      <button class="opt" data-ok="0" data-fb="On Monday Ben asks Claude Code about AC-0999. His request carries the same key as Anika's, so Atlas sees northwind-pilot and replies 403: &quot;I know who you are, and the answer is no.&quot; Ben cannot work on day one. Atlas cannot treat Ben differently, because it cannot tell his requests from Anika's.">Only AC-0417</button>
      <button class="opt" data-ok="1" data-fb="Right. Both account managers can work. The price is written into the record: whoever holds the key may read both customers' data. So Ben can read AC-0417 and Anika can read AC-0999. The tests come back to this.">AC-0417 and AC-0999</button>
      <button class="opt" data-ok="0" data-fb="Then the key also reads every customer nobody in the pilot manages. If it leaks, all of Northwind's customer data leaks with it. Give a key the least it needs.">Every Northwind customer, to save edits later</button>
    </div>
    <div class="feedback" id="fb2"></div>
  </div>
  <div id="handBox" style="display:none">
  <div class="box how"><span class="tag">How: the hand-over and the paste</span>
  Tomasz sends the key to Northwind's admin by a <b>one-time secret link</b>, a page that shows it once and then
  deletes it. (An email would sit in mailboxes and backups for years.) The admin adds Atlas to each account manager's
  Claude Code:
  <pre class="req">claude mcp add --transport http atlas https://mcp.atlas.example/mcp \\
  --header "Authorization: Bearer atk_7QmZ9xL2..."</pre>
  <code>--transport http</code>: a remote server, reached over HTTP. <code>--header</code>: add this line to every
  request. <code>Bearer</code>: "whoever holds this may use it" (Level 0). Claude Code saves it in
  <code>~/.claude.json</code>, a settings file in the home folder. The key now lives on two laptops.</div>
  <details class="more"><summary>Which hosts can send a fixed header?</summary><div>
  <b>Claude Code:</b> yes, with <code>--header</code> as above. In a project's shared <code>.mcp.json</code> file, write
  <code>"Authorization": "Bearer \${ATLAS_KEY}"</code>: Claude Code fills in the environment variable, so the key itself
  never lands in the repository.<br>
  <b>Claude on the web, desktop and mobile:</b> only in beta. The "Request headers" section of Add custom connector is
  available to a limited set of organizations. An organization Owner enters the key once, and every member's requests
  carry it. Anthropic's own documentation says not to use it to tell which user is calling.<br>
  <b>ChatGPT:</b> no. OpenAI's Apps SDK documentation says ChatGPT cannot present custom API keys; a server must offer
  a per-person sign-in, or no authentication at all.<br>
  Checked 2026-10.</div></details>
  <details class="more"><summary>Common misreading: "the key is Anika's key"</summary><div>
  It is pasted on Anika's laptop, so it feels like hers. But nothing in it, and nothing in Atlas's record, says Anika.
  Atlas sees a string that maps to <code>northwind-pilot</code>, whether Anika, Ben or anyone else sent it.</div></details>
  </div>`,
  ready: false,
  enter(api) {
    focusNode("n-claude");
    api.choice("#ch2", "#fb2", () => {
      $("#customers").textContent = "AC-0417, AC-0999";
      $("#handBox").style.display = "block";
      light(["n-people", "n-claude", "w-ask", "x-key"]);
      unlock("service account");
      setTimeout(() => unlock("fixed header in the host"), 1900);
    });
  }
},
{
  phase: "request",
  html: `
  <div class="kicker">Stop 3 of 6 &middot; The request</div>
  <h2>Monday, 9:12, with the key</h2>
  <p>Monday, 9:12. Anika asks Claude Code how many shipments AC-0417 booked this week. Claude Code sends
  Level 0's request, now with the key from its settings. <b>Click each underlined part.</b></p>
  <pre class="req"><span class="part" data-k="line">POST /mcp HTTP/1.1
Host: mcp.atlas.example</span>
<span class="part" data-k="auth"><span class="hl">Authorization: Bearer atk_7QmZ9xL2vR4kT8nB1cW6yF3hJ0sD5gA2pEXAMPLEKEY</span></span>
<span class="part" data-k="mcp">Content-Type: application/json
Accept: application/json, text/event-stream
MCP-Protocol-Version: 2026-07-28
Mcp-Method: tools/call
Mcp-Name: shipment_summary</span>

<span class="part" data-k="body">{"jsonrpc": "2.0", "id": 7, "method": "tools/call",
 "params": {"name": "shipment_summary",
            "arguments": {"customer": "AC-0417"},
            "_meta": {"io.modelcontextprotocol/clientInfo":
                        {"name": "claude"}}}}</span></pre>
  <div class="explain" id="reqText"><span class="hint">Click a part of the request.</span></div>
  <div class="challenge" id="ch3">
    <h3>Challenge: what Atlas does at the door</h3>
    <p>Put Atlas's checks in order. Click the step that comes first, then the next.</p>
    <div id="order3"></div>
  </div>`,
  ready: false,
  enter(api) {
    focusNode("n-claude");
    light(["n-atlas"]);
    api.parts("pre.req .part", {
      line: "<b>Where it goes.</b> A <code>POST</code> to <code>/mcp</code>, Atlas's MCP door, on the server <code>mcp.atlas.example</code>. Exactly as in Level 0.",
      auth: "<b>The key.</b> In the <code>Authorization</code> header, the standard place for a credential. Claude Code adds this exact line to every request, for Anika and for Ben alike, because it is the same line in both laptops' settings.",
      mcp: "<b>MCP's own headers</b> from Level 0: the format, the protocol version, and a copy of what the body asks for (call a tool, named <code>shipment_summary</code>), so Atlas can route the request before opening the body.",
      body: "<b>The question.</b> Call the tool <code>shipment_summary</code>, which returns how many shipments a customer booked, for AC-0417. Look for Anika's name anywhere in the request: it is not there."
    }, "#reqText");
    api.order("#order3", [
      { t: "Read the <code>Authorization</code> header and take the string after <code>Bearer</code>.",
        why: "No header at all: 401, Atlas's \"I don't know who you are\" from Level 0.",
        early: "Atlas cannot check a key it has not read yet.",
        onRight() { light(["w-req"]); sendPacket("w-req", "var(--warn)"); } },
      { t: "Check the format: <code>atk_</code> followed by 43 characters.",
        why: "A cheap check before any lookup. A malformed or half-pasted key fails here: 401.",
        early: "First Atlas needs the string itself, from the header." },
      { t: "Hash the presented key with SHA-256.",
        why: "Atlas stored only the hash, so it can only compare hashes.",
        early: "Hashing comes after the cheap format check, so junk costs Atlas nothing." },
      { t: "Look up the hash: record <code>k_01</code>, active, account <code>northwind-pilot</code>.",
        why: "No match, or a switched-off key: 401. This answers \"who is calling?\", and the answer is an account, not a person.",
        early: "The records hold hashes, so Atlas must hash the key before it can look anything up.",
        onRight() { light(["w-look"]); sendPacket("w-look"); } },
      { t: "Check the customer: is AC-0417 on <code>northwind-pilot</code>'s list?",
        why: "Not on the list: 403, \"I know who you are, and the answer is no\". This answers \"what may they do?\", for the account.",
        early: "Atlas cannot ask what the caller may do before it knows which account is calling." },
      { t: "Run <code>shipment_summary</code>, reply, and write the audit line.",
        why: "Only after both answers are yes.",
        early: "The tool runs last, after both questions are answered.",
        onRight() { light(["w-res"]); sendPacket("w-res", "var(--ok)"); } }
    ], () => unlock("Atlas checks the key's hash, then the account's list"));
  }
},
{
  phase: "response",
  html: `
  <div class="kicker">Stop 4 of 6 &middot; The response</div>
  <h2>200, and one line in the log</h2>
  <p>Both checks pass. Atlas runs the tool and replies <b>200</b> (OK):</p>
  <pre class="req">HTTP/1.1 200 OK
Content-Type: application/json

{"jsonrpc": "2.0", "id": 7,
 "result": {"resultType": "complete",
            "content": [{"type": "text",
              "text": "AC-0417: 23 shipments booked this week (412 this year)."}]}}</pre>
  <p>Then it writes its <b>audit log</b>, the record of who did what. One day <b>Yuki</b>, Northwind's compliance lead,
  will read it. Northwind promises its customers it can say who looked at their data.</p>
  <pre class="req">2030-03-11T09:12:03Z key=k_01 account=<span class="hl">northwind-pilot</span> tool=shipment_summary customer=AC-0417 status=200 ip=203.0.113.24</pre>
  <p>The line names the key and its account. It cannot name Anika: Atlas never learned her name.</p>
  <div class="challenge" id="ch4">
    <h3>Challenge: what does Atlas reply?</h3>
    <p>Atlas still refuses some requests. Sort these.</p>
    <div id="sort4"></div>
  </div>`,
  ready: false,
  enter(api) {
    focusNode("n-atlas");
    light(["x-log"]);
    api.sort("#sort4", [
      { t: "The key with one character wrong, from a careless paste.", a: "401",
        fb: "Its hash matches no record, so Atlas does not know who is calling: <code>401 Unauthorized</code>, with the header <code>WWW-Authenticate: Bearer error=\"invalid_token\"</code> to say the key was not accepted. There is no sign-in page to point to.",
        wrong: {
          "403": "403 would mean Atlas knows which account is calling. One changed character gives a completely different hash, so no record matches and Atlas knows nobody.",
          "200": "Then any near miss would open the door. The changed character gives a different SHA-256 hash, the lookup finds nothing, and the tool never runs." } },
      { t: "The real key, asking for AC-0123, a customer outside the pilot.", a: "403",
        fb: "Atlas knows the account, and AC-0123 is not on its list: 403.",
        wrong: {
          "401": "401 would say Atlas cannot tell who is calling. But the key is real: its hash matches <code>k_01</code>, so Atlas knows the account. The second question fails, not the first.",
          "200": "Then the key would read customers outside the pilot. The account's list is AC-0417 and AC-0999, and AC-0123 is not on it." } },
      { t: "The real key, asking for AC-0999.", a: "200",
        fb: "AC-0999 is on <code>northwind-pilot</code>'s list: 200. Atlas cannot ask who typed the question.",
        wrong: {
          "401": "The key is real and active, so the lookup finds <code>k_01</code> and Atlas knows the account. 401 is only for a key it cannot match.",
          "403": "403 would need AC-0999 to be off the list. It is on it, because Ben needs it, so whoever holds the key gets the numbers." } },
      { t: "The real key, after Helix switches its record to <code>revoked</code> (turned off for good).", a: "401",
        fb: "The hash still matches, but the record is revoked, so the key proves nothing any more: 401.",
        wrong: {
          "403": "403 says \"I know who you are\". A revoked record no longer proves anything, so Atlas treats the caller as unknown.",
          "200": "Then revoking would do nothing, and a leaked key could never be stopped. Atlas reads <code>status: revoked</code> at the lookup and stops there." } }
    ], ["401", "403", "200"], () => unlock("the audit names the account, not the person"));
  }
},
{
  phase: "tests",
  html: `
  <div class="kicker">Stop 5 of 6 &middot; Tests</div>
  <h2>Two weeks of pilot, and one "what if"</h2>
  <p>Helix can <b>rotate</b> the key (replace it with a new one), but nobody has set a date for that. Predict what
  Atlas replies each time, then watch the map. Watch for the pattern, and for the one card that breaks it. Each answer
  fills one row of the scorecard.</p>
  <div class="challenge" id="ch5">
    <h3>Predict, then watch</h3>
    <div id="sort5"></div>
  </div>
  <div class="challenge" id="ch5b">
    <h3>Yuki's question</h3>
    <p>Two weeks into the pilot, Yuki prepares for an audit by customer AC-0417 and asks Helix: <i>"Who read AC-0417's data
    since the pilot started?"</i> <b>What can Helix truthfully answer?</b></p>
    <div class="opts">

  <details class="more"><summary>The IP allowlist and AI apps that run in the cloud</summary><div>
  Claude Code runs on the laptop, so its requests come from Northwind's office or VPN addresses, and an allowlist can

  <p><b>Buy the key checking; build what the key means.</b> <b>Azure API Management</b> (APIM), Microsoft's API gateway

  <b>subscription keys</b> are API keys. Each subscription holds a pair, primary and secondary, so callers switch to one

&lt;!-- APIM policy, inbound section --&gt;
&lt;ip-filter action="allow"&gt;

&lt;/ip-filter&gt;

  <p><b>The usual mistake:</b> APIM passes the key on to the backend by default, where it lands in Atlas's own logs. The

# Northwind's side; reading from a file keeps the key out of shell history

  <pre class="req">import secrets, hashlib

def issue_key(account):
    key = "atk_" + secrets.token_urlsafe(32)        # 32 random bytes, 43 characters
    db.insert(hash=hashlib.sha256(key.encode()).hexdigest(),

    return key                                       # shown once, never stored

def account_for(presented):
    if not presented.startswith("atk_"):

    row = db.get(hash=hashlib.sha256(presented.encode()).hexdigest())
    return row.account if row and row.status == "active" else None</pre>
